name: Build Viola Scores

on:
  push:
    paths:
      - 'viola/**'
      - '.github/workflows/viola-lilypond.yml'
  pull_request:
    paths:
      - 'viola/**'
      - '.github/workflows/viola-lilypond.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNU LilyPond
        run: |
          sudo apt-get update
          sudo apt-get install -y lilypond

      - name: Build top-level viola scores
        shell: bash
        run: |
          shopt -s nullglob
          files=(viola/*.ly)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No top-level .ly files found in viola/."
            exit 1
          fi

          for file in "${files[@]}"; do
            lilypond "$file"
          done

      - name: Create gzip tarball of generated PDFs and MIDI files
        shell: bash
        run: |
          shopt -s nullglob
          files=(viola/*.pdf viola/*.midi)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No generated .pdf or .midi files found in viola/."
            exit 1
          fi

          tar -czf viola-build-artifacts.tar.gz "${files[@]}"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: viola-lilypond-build
          path: viola-build-artifacts.tar.gz

      - name: Prepare GitHub Pages content (PDF only)
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p pages
          pdfs=(viola/*.pdf)
          if [ ${#pdfs[@]} -eq 0 ]; then
            echo "No generated .pdf files found in viola/."
            exit 1
          fi

          cp "${pdfs[@]}" pages/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy-pages:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
